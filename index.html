<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AHYPAR | Community Survey</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-magenta: #ff0055;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg-dark: #08080a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-dark);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #pc-lock {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        @media (min-width: 1025px) {
            #pc-lock { display: flex; }
            .mobile-wrapper { display: none; }
        }

        .mobile-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: radial-gradient(circle at top right, #101827, #08080a);
        }

        .main-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .main-header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            color: #fff;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            display: inline-block;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
            margin-top: 5px;
            border-radius: 2px;
        }

        .progress-bar {
            width: 33%;
            height: 100%;
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step {
            display: none;
            margin-top: 30px;
            animation: slideIn 0.5s ease forwards;
        }

        .step.active { display: block; }

        h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
            color: var(--neon-blue);
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .card input { display: none; }

        .card.selected {
            border-color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.1);
        }

        input[type="text"], textarea {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }

        .btn-glow {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 5px;
            margin-top: 10px;
        }

        .btn-glow:active {
            background: var(--neon-blue);
            color: #000;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 15px;
            font-size: 10px;
            opacity: 0.5;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="pc-lock">
        <h1 style="color: var(--neon-blue); font-family: 'Rajdhani';">MOBILE ACCESS ONLY</h1>
        <p style="margin-top: 10px; opacity: 0.7;">Please use a mobile device to complete the survey.</p>
    </div>

    <div class="mobile-wrapper">
        <header class="main-header">
            <h1>AHYPAR <span style="color: var(--neon-blue);">COMMUNITY SURVEY</span></h1>
        </header>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <form id="surveyForm">
            <div class="step active" id="step1">
                <h2>How is your experience with AHYPAR?</h2>
                <div class="options-grid">
                    <label class="card" onclick="selectOption(this, 1, 'Excellent')">
                        <input type="radio" name="Experience" value="Excellent">
                        <span>⚡ Excellent (Pro Level)</span>
                    </label>
                    <label class="card" onclick="selectOption(this, 1, 'Good')">
                        <input type="radio" name="Experience" value="Good">
                        <span>🔥 Good (Rising)</span>
                    </label>
                    <label class="card" onclick="selectOption(this, 1, 'Average')">
                        <input type="radio" name="Experience" value="Average">
                        <span>🎮 Average (Needs Focus)</span>
                    </label>
                </div>
                <button type="button" class="btn-glow" style="margin-top: 20px;" onclick="move(2)">NEXT</button>
            </div>

            <div class="step" id="step2">
                <h2>Which arena should we focus on more?</h2>
                <div class="options-grid">
                    <label class="card" onclick="selectOption(this, 2, 'Grand Mobile')">
                        <input type="radio" name="Focus_Area" value="Grand Mobile">
                        <span>🛰️ Grand Mobile RP</span>
                    </label>
                    <label class="card" onclick="selectOption(this, 2, 'BGMI')">
                        <input type="radio" name="Focus_Area" value="BGMI">
                        <span>🔫 BGMI / Global Scrims</span>
                    </label>
                    <label class="card" onclick="selectOption(this, 2, 'Free Fire')">
                        <input type="radio" name="Focus_Area" value="Free Fire">
                        <span>🗡️ Free Fire Tournaments</span>
                    </label>
                </div>
                <button type="button" class="btn-glow" style="margin-top: 20px;" onclick="move(3)">NEXT</button>
            </div>

            <div class="step" id="step3">
                <h2>YOUR INSIGHTS</h2>
                <input type="text" id="userName" name="Name" placeholder="Your Name" required>
                <textarea id="userAdvice" name="Advice" rows="4" placeholder="How can we improve AHYPAR for you?" required></textarea>
                
                <button type="button" id="submitBtn" class="btn-glow" onclick="submitSurvey()">TRANSMIT FEEDBACK</button>
            </div>
        </form>

        <footer>
            © 2026 AHYPAR ESPORTS | IMPROVING THROUGH YOUR VOICE
        </footer>
    </div>

    <script>
        function selectOption(element, step, value) {
            const parent = element.parentElement;
            parent.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
        }

        function move(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');

            const percent = (step / 3) * 100;
            document.getElementById('progressBar').style.width = percent + '%';
        }

        async function submitSurvey() {
            const btn = document.getElementById('submitBtn');
            const form = document.getElementById('surveyForm');
            const formData = new FormData(form);
            
            // Check if name and advice are filled
            if(!document.getElementById('userName').value || !document.getElementById('userAdvice').value) {
                alert("Please complete the form!");
                return;
            }

            btn.innerText = "TRANSMITTING...";
            btn.disabled = true;

            try {
                const response = await fetch("https://formspree.io/f/mwvaknwl", {
                    method: "POST",
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    alert("Thank you! Your feedback has been recorded.");
                    window.location.reload(); 
                } else {
                    alert("Submission failed. Please try again.");
                }
            } catch (error) {
                alert("Error connecting to server.");
            } finally {
                btn.innerText = "TRANSMIT FEEDBACK";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
